<style>
  /* Layout: app shell — translucent top bar, one 600px column of soft rounded cards, fixed bottom tab bar with six sections.

  :root {

    --bg2: #FFF1E8; --lav: #2E7D66; --lav-soft: #D9F1E8; --period: #C64A37; --period-soft: #FFE1D9; --fert: #3E9C80; --fert-soft: #D9F1E8; --ovu: #23604E;

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

    --bg2: #2F2539; --lav: #8FD6BE; --lav-soft: #1F3B34; --period: #FF9A86; --period-soft: #4A2C30; --fert: #8FD6BE; --fert-soft: #1F3B34; --ovu: #BDEBDB;

  .banner { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }

  .bar-p { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-p i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }

  .timeline { display: grid; gap: 0; }

  .tl button { border: 0; background: none; text-align: left; padding: 0; font-weight: 600; }

  .check label { font-size: 15px; }

  .steps { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }

  .steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 800; display: grid; place-items: center; font-size: 14px; }

  details.art .chev { transition: transform .2s; color: var(--muted); }

  .src { font-size: 12px; color: var(--muted); }

  .week i.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .week i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .week .wd { border: 0; background: none; padding: 0; display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .week .wd[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
  .week i.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .tick.locked { color: var(--muted); background: var(--surface-2); border-style: dashed; }
  .tick.done { background: var(--ok); border-color: var(--ok); color: #fff; }

  .pic { border-radius: 12px; overflow: hidden; line-height: 0; }
  .pic svg { width: 100%; height: auto; display: block; }
  .card.game { gap: 12px; }
  .btn.yt { background: var(--bad-bg); color: var(--bad); text-decoration: none; justify-self: start; }
  .vid { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vlist { display: grid; }
  .vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

  .vrow .vid { flex-basis: 100%; }
  .qrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .say { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; padding: 0; }
  .rep-img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
  .ephoto { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
  .gwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

  .tear-top { height: 26px; background: var(--accent); display: flex; justify-content: space-around; align-items: center; }
  .tear-top .ring { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 2px 0 rgba(0,0,0,.25); }

  .tear-date b { font-size: 52px; line-height: 1; color: var(--accent); font-weight: 800; }

  .tear-body { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px 16px; align-items: start; }
  .tear-emoji { width: 64px; height: 64px; border-radius: 18px; background: var(--teal-soft); display: grid; place-items: center; font-size: 36px; }
  .tear-body h3 { margin-bottom: 4px; }

  .myth { display: grid; gap: 6px; }

  .myth .t { display: flex; gap: 8px; }
  .myth .t::before { content: "✓"; color: var(--ok); font-weight: 800; }
  .myth .m::before { content: "✕"; font-weight: 800; }

  .report { font-family: inherit; white-space: pre-wrap; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 14px; overflow-wrap: anywhere; }

  form.f { display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .field input, .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; min-width: 0; width: 100%; }
  .err { color: var(--bad); font-size: 14px; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* brand D «Тәтті»: coral, peach, mint, butter; Montserrat Alternates + Nunito; big soft radii, flat colour cards */
  body { background: var(--bg); }
  body::before { background: var(--bg); }
  header.bar { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0; }
  .brand b { font-family: "Quicksand", "Nunito", sans-serif; font-weight: 700; font-size: 23px; line-height: 1; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); }
  .brand small, p:empty, span.small:empty, .tiny:empty { display: none; }
  .h1, .h2, #mom h1, #mom h2, #mom .week, #mom .ringtext .big, #mom .stat b, .tear-date b { font-family: var(--serif); font-weight: 700; letter-spacing: -.01em; }
  .h1 { font-size: 24px !important; } .h2 { font-size: 20px !important; } #mom h1 { font-size: 28px; } #mom h2 { font-size: 22px; }
  .h3, #mom h3 { font-weight: 800; }
  .eyebrow { color: var(--accent); font-weight: 800; }
  .sndbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--butter); display: grid; place-items: center; font-size: 17px; padding: 0; flex: none; }
  .sndbtn[aria-pressed="false"] { opacity: .45; filter: grayscale(1); }
  main { gap: 14px; }
  .card, .card.flat, details.art, .tear, .q { box-shadow: none; border: 0; }
  .card { border-radius: 30px; padding: 20px; }
  .card.flat { background: var(--surface-2); }
  .btn, .btn.sm { border-radius: 999px; font-weight: 800; }
  .btn.primary { background: var(--accent); }
  .btn.soft { background: var(--teal-soft); color: var(--teal); }
  .seg { border-radius: 999px; padding: 3px; background: var(--surface); border: 0; }
  .seg button { border-radius: 999px; }
  .chip { border-width: 1.5px; }
  .chip[aria-pressed="true"] { background: var(--butter); border-color: var(--butter); color: var(--fg); }
  .avatar { background: var(--peach); color: var(--fg); font-family: var(--serif); }

const SND = (() => {

    const t = c.currentTime + 0.005, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(280, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.054);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);

/* ---------- cycle math ---------- */
function starts() { return S.periods.map(p => p.start).sort(); }
function cycleLens() {
  const st = starts(); const out = [];
  for (let i = 1; i < st.length; i++) { const L = diff(st[i], st[i - 1]); if (L >= 15 && L <= 60) out.push(L); }
  return out;
}
function avgCycle() { const L = cycleLens().slice(-6); return L.length ? Math.round(L.reduce((a, b) => a + b, 0) / L.length) : S.cycleLen; }
function avgPeriod() {
  const L = S.periods.filter(p => p.end).map(p => diff(p.end, p.start) + 1).filter(n => n > 0 && n < 15).slice(-6);
  return L.length ? Math.round(L.reduce((a, b) => a + b, 0) / L.length) : S.periodLen;
}
function lastStart() { const st = starts(); return st[st.length - 1] || null; }
function openPeriod() { const p = S.periods.slice().sort((a, b) => a.start.localeCompare(b.start)).pop(); return p && !p.end && diff(today(), p.start) < 15 ? p : null; }
function cycleInfo(day = today()) {
  const ls = lastStart(); if (!ls) return null;
  const C = avgCycle(), P = avgPeriod();
  const cd = diff(day, ls) + 1;
  let next = add(ls, C); const late = diff(day, next);
  const ovu = add(next, -14), fertS = add(ovu, -5), fertE = add(ovu, 1);
  const inPeriod = isPeriodDay(day);
  let ph = 'fol';
  if (inPeriod) ph = 'men'; else if (day === ovu) ph = 'ovu'; else if (day >= fertS && day <= fertE) ph = 'fert'; else if (day > ovu) ph = 'lut';
  const dOvu = diff(ovu, day);
  const chance = (day >= fertS && day <= fertE) ? (dOvu >= -0 && dOvu <= 2 ? 'high' : 'mid') : 'low';
  return { ls, C, P, cd, next, ovu, fertS, fertE, ph, chance, late: late > 0 ? late : 0, toNext: diff(next, day) };
}
function isPeriodDay(day) {
  for (const p of S.periods) { const e = p.end || add(p.start, avgPeriod() - 1); if (day >= p.start && day <= e) return true; }
  const l = S.logs[day]; return !!(l && l.flow > 0);
}
/* predictions for calendar: next 6 cycles */
function marks() {
  const m = {}; const ls = lastStart(); if (!ls) return m;
  const C = avgCycle(), P = avgPeriod();
  for (let k = 1; k <= 6; k++) {
    const s = add(ls, C * k), ovu = add(s, -14);
    for (let i = 0; i < P; i++) m[add(s, i)] = m[add(s, i)] || 'pred';
    for (let i = -5; i <= 1; i++) { const d = add(ovu, i); if (!m[d]) m[d] = i === 0 ? 'ovu' : 'fert'; }
  }
  /* current cycle fertile window (before the first predicted period) */
  const ovu0 = add(add(ls, C), -14);
  for (let i = -5; i <= 1; i++) { const d = add(ovu0, i); if (!m[d]) m[d] = i === 0 ? 'ovu' : 'fert'; }
  for (const p of S.periods) { const e = p.end || add(p.start, P - 1); for (let d = p.start; d <= e; d = add(d, 1)) m[d] = 'period'; }
  for (const [d, l] of Object.entries(S.logs)) if (l.flow > 0) m[d] = 'period';
  return m;
}
function pregInfo(day = today()) {
  if (!S.preg) return null;
  const days = diff(day, S.preg.lmp); const w = Math.floor(days / 7), dd = days % 7;
  const due = add(S.preg.lmp, 280); const tri = w < 13 ? 1 : w < 27 ? 2 : 3;
  return { w, dd, due, tri, left: diff(due, day), pct: Math.min(100, Math.max(0, days / 280 * 100)) };
}

/* ---------- reminders (.ics), share, export ---------- */
function buildIcs() {
  const x = t(); const ev = []; const c = cycleInfo();
  const dt = s => s.replace(/-/g, '');
  const push = (d, sum, rr) => ev.push(`BEGIN:VEVENT\r\nUID:${dt(d)}-${ev.length}@aisulu\r\nDTSTAMP:${dt(today())}T090000Z\r\nDTSTART;VALUE=DATE:${dt(d)}\r\nSUMMARY:${sum}\r\n${rr || ''}BEGIN:VALARM\r\nTRIGGER:-PT15H\r\nACTION:DISPLAY\r\nDESCRIPTION:${sum}\r\nEND:VALARM\r\nEND:VEVENT`);
  if (S.mode === 'preg') { const p = pregInfo(); if (p) push(p.due, x.due); }
  else if (c) {
    for (let k = 0; k < 6; k++) { const s = add(c.next, c.C * k); push(add(s, -2), `QUŞAQ: ${x.periodsIn(2)}`); push(add(s, -14), `QUŞAQ: ${x.lgOvu}`); push(add(s, -19), `QUŞAQ: ${x.fertWin}`); }
    if (Object.values(S.logs).some(l => l.pill)) push(add(today(), 1), `QUŞAQ: 💊 ${x.pill}`, 'RRULE:FREQ=DAILY\r\n');
  }
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//QUŞAQ//RU\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`;
}
function download(name, text, type) {
  const blob = new Blob([text], { type });
  if (navigator.canShare && navigator.share) { try { const f = new File([blob], name, { type }); if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(() => {}); return; } } catch (e) {} }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent), STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;

// the service worker cannot read localStorage, so the app writes the next 21 days of messages into Cache Storage
async function syncNotifSchedule() {
  if (!notifOK()) return;
  try {
    const t = L(), days = [], now = new Date();
    for (let o = 0; o < 21; o++) {
      const d = new Date(now); d.setDate(d.getDate() + o); const di = iso(d); let msg = null;
      for (const c of S.children) {
        const cm = corrM(c, d), si = stageIdx(cm), st = STAGES[si], D = (S.done[c.id] || {});
        const sd = new Date(c.dob + 'T12:00:00'); sd.setMonth(sd.getMonth() + st.min); const since = Math.round((d - sd) / 864e5);
        if (cm >= 2 && !D[st.min] && since >= 0 && since % 3 === 0) { msg = { title: t.nDue(c.name, st.label[li()]), body: t.nDueBody, tag: 'ek-check-' + c.id + '-' + st.min }; break; }
      }
      if (!msg) { const tp = TIPS[tipIndex(d)]; msg = { title: `${tp[0]} ${S.lang === 'kk' ? tp[1] : tp[3]}`, body: S.lang === 'kk' ? tp[2] : tp[4], tag: 'ek-tip' }; }
      days.push({ date: di, ...msg });
    }
    const cache = await caches.open('ek-data');
    await cache.put('ek-schedule.json', new Response(JSON.stringify({ on: !!S.notif, days }), { headers: { 'Content-Type': 'application/json' } }));
  } catch (e) {}
}
async function enableNotif() {

    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { render(); return; }
    S.notif = true; save(); await syncNotifSchedule();
    const reg = await navigator.serviceWorker.ready;
    let bg = false;
    try { if ('periodicSync' in reg) { const st = await navigator.permissions.query({ name: 'periodic-background-sync' }); if (st.state === 'granted') { await reg.periodicSync.register('ek-daily', { minInterval: 12 * 3600 * 1000 }); bg = true; } } } catch (e) {}
    ui.noBg = !bg;

  } catch (e) {}

}

const DAY = 864e5;

// games of a given day: the age group at that date, rotated so each day starts with its own "game of the day"

  const k = Math.floor(d.getTime() / DAY) % g.items.length;

}

function reportText(c) {
  const t = L(), r = t.rep, k = li() + 1, cm = corrM(c), si = stageIdx(cm), D = doneOf(c.id), A = ansOf(c.id);

  const stages = STAGES.filter((s, i) => i <= si && (A[s.min] && Object.keys(A[s.min]).length || i === si)).reverse().slice(0, 3);
  stages.forEach(s => {
    const a = A[s.min] || {}, no = s.items.filter((_, i) => a[i] === 'no'), un = s.items.filter((_, i) => a[i] === 'unsure');
    const na = s.items.filter((_, i) => a[i]).length;
    lines.push('', `${r.stage} ${s.label[li()]} — ${D[s.min] ? r.checked + ' ' + fmtDate(D[s.min]) : na ? r.partial(na, s.items.length) : r.notChecked}`);
    const ys = s.items.filter((_, i) => a[i] === 'yes');
    if (no.length) { lines.push(r.no); s.items.forEach((x, i) => { if (a[i] === 'no') lines.push('  ✗ ' + ((negOf(s.min, i) || [])[li()] || x[k])); }); }
    if (un.length) { lines.push(r.unsure); un.forEach(x => lines.push('  ? ' + x[k])); }

    if (D[s.min] && !no.length && !un.length) lines.push(r.allYes);

  const F = (S.flags[c.id] || []).map(i => FLAGS[i][li()]);

}
