<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Құшақ"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style><title>Құшақ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  /* Layout: app shell — translucent top bar, one 600px column of soft rounded cards, fixed bottom tab bar with six sections.
     Palette: rose and lavender on a blush ground (Flo-like); serif headings; semantic green / amber / red only for results. */
  :root {
    --bg: #F2F2F7; --surface: #FFFFFF; --surface-2: #F2F2F7; --fg: #1C1C1E; --muted: #6C6C70; --line: #E5E5EA;
    --accent: #E8473A; --accent-fg: #FFFFFF; --accent-soft: #FFE9E6; --teal: #00897B; --teal-soft: #DDF5F2;
    --ok: #248A3D; --ok-bg: #E3F6E8; --warn: #B25000; --warn-bg: #FFF1E0; --bad: #D70015; --bad-bg: #FFE5E7;
    --bg2: #F2F2F7; --lav: #5E5CE6; --lav-soft: #ECECFD; --period: #FF2D55; --period-soft: #FFE3EA; --fert: #5E5CE6; --fert-soft: #E8E8FC; --ovu: #3634A3;
    --butter: #FFF4D6; --peach: #FFE9E6; --shadow: none;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --script: var(--serif);
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fg: #FFFFFF; --muted: #98989F; --line: #38383A;
    --accent: #FF453A; --accent-fg: #FFFFFF; --accent-soft: #3A1A16; --teal: #66D4CF; --teal-soft: #0E2E2C;
    --ok: #30D158; --ok-bg: #0F2E18; --warn: #FF9F0A; --warn-bg: #33240A; --bad: #FF453A; --bad-bg: #3A1311;
    --bg2: #1C1C1E; --lav: #7D7AFF; --lav-soft: #1F1E3D; --period: #FF375F; --period-soft: #3D1520; --fert: #7D7AFF; --fert-soft: #1F1E3D; --ovu: #A5A3FF;
    --butter: #3A3220; --peach: #3A1E1A; --shadow: none; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fg: #FFFFFF; --muted: #98989F; --line: #38383A;
    --accent: #FF453A; --accent-fg: #FFFFFF; --accent-soft: #3A1A16; --teal: #66D4CF; --teal-soft: #0E2E2C;
    --ok: #30D158; --ok-bg: #0F2E18; --warn: #FF9F0A; --warn-bg: #33240A; --bad: #FF453A; --bad-bg: #3A1311;
    --bg2: #1C1C1E; --lav: #7D7AFF; --lav-soft: #1F1E3D; --period: #FF375F; --period-soft: #3D1520; --fert: #7D7AFF; --fert-soft: #1F1E3D; --ovu: #A5A3FF;
    --butter: #3A3220; --peach: #3A1E1A; --shadow: none; color-scheme: dark }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.25; }
  p { margin: 0; }
  ul, ol { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 600px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .backbtn { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 14px 0 8px; margin-right: -4px; border: 0; border-radius: 19px; background: var(--accent); color: var(--accent-fg); font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
  .backbtn svg { width: 22px; height: 22px; }
  .backbtn[hidden] { display: none; }
  .backbtn:not([hidden]) + .brand small, .backbtn:not([hidden]) + .brand b { display: none; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand b { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; font-weight: 700; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

  main { max-width: 600px; margin: 0 auto; padding-block: 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
  .tabbar button { border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 2px; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .tabbar button[aria-current="page"] .pill { background: var(--accent-soft); }
  .tabbar .pill { padding: 2px 14px; border-radius: 999px; display: grid; place-items: center; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
  .card.flat { background: var(--surface-2); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .h1 { font-size: 22px; font-weight: 800; }
  .h2 { font-size: 18px; font-weight: 700; }
  .h3 { font-size: 15px; font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .tiny { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 10px; }

  .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.line { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }

  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kv b { display: block; font-size: 15px; }
  .kv span { font-size: 12px; color: var(--muted); }

  .banner { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }
  .banner b { font-size: 15px; }
  .banner p { color: var(--fg); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.todo { background: var(--accent-soft); color: var(--accent); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }

  .q { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface); }
  .q.yes { border-left-color: var(--ok); }
  .q.no { border-left-color: var(--warn); }
  .q.unsure { border-left-color: var(--accent); }
  .q p { font-weight: 600; }
  .ans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ans button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .ans button[aria-pressed="true"][data-v="yes"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .ans button[aria-pressed="true"][data-v="no"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .ans button[aria-pressed="true"][data-v="unsure"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .domain-t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .domain-t i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }

  .bar-p { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-p i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }

  .vx { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
  .vx.done { border-left-color: var(--ok); }
  .vx.due { border-left-color: var(--accent); }
  .vx.late { border-left-color: var(--bad); }
  .vx ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
  .vx .row { flex-wrap: wrap; }
  .gchart { width: 100%; height: auto; display: block; }
  .glegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .glegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .timeline { display: grid; gap: 0; }
  .tl { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .tl:last-child { border-bottom: 0; }
  .tl .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); justify-self: center; }
  .tl .dot.ok { background: var(--ok); border-color: var(--ok); }
  .tl .dot.warn { background: var(--warn); border-color: var(--warn); }
  .tl .dot.cur { border-color: var(--accent); background: var(--accent-soft); }
  .tl button { border: 0; background: none; text-align: left; padding: 0; font-weight: 600; }

  .check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--bad); }
  .check label { font-size: 15px; }

  .steps { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .steps .card { padding: 12px 14px; gap: 4px; }

  details.art { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  details.art summary { list-style: none; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr 20px; gap: 12px; align-items: center; cursor: pointer; }
  details.art summary::-webkit-details-marker { display: none; }
  details.art .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
  details.art .ic svg { width: 22px; height: 22px; }
  details.art .chev { transition: transform .2s; color: var(--muted); }
  details.art[open] .chev { transform: rotate(90deg); }
  details.art.urgent .ic { background: var(--bad-bg); }
  details.art .body { padding: 0 16px 16px; display: grid; gap: 10px; }
  details.art ul { padding-left: 20px; display: grid; gap: 6px; }
  .src { font-size: 12px; color: var(--muted); }

  .act { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
  .tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .week div { display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .week i { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-style: normal; font-weight: 700; color: var(--fg); font-size: 12px; }
  .week i.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .week i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .week .wd { border: 0; background: none; padding: 0; display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .week .wd[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
  .week i.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .tick.locked { color: var(--muted); background: var(--surface-2); border-style: dashed; }
  .tick.done { background: var(--ok); border-color: var(--ok); color: #fff; }

  .pic { border-radius: 12px; overflow: hidden; line-height: 0; }
  .pic svg { width: 100%; height: auto; display: block; }
  .card.game { gap: 12px; }
  .btn.yt { background: var(--bad-bg); color: var(--bad); text-decoration: none; justify-self: start; }
  .vid { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vlist { display: grid; }
  .vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .vrow:last-child { border-bottom: 0; }
  .vrow .vid { flex-basis: 100%; }
  .qrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .say { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; padding: 0; }
  .rep-img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
  .ephoto { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
  .gwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .gstat { display: grid; gap: 2px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .gstat b { font-size: 20px; }
  .spark { width: 100%; height: 60px; }
  .neg { list-style: none; padding: 0; margin: 2px 0; display: grid; gap: 4px; color: var(--fg); }
  .neg li::before { content: '• '; color: var(--warn); font-weight: 800; }
  .tear { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 18px rgba(20,36,58,.08); transform: rotate(-0.6deg); }
  .tear.flip { animation: flip .45s ease; }
  @keyframes flip { 0% { transform: rotate(-0.6deg) rotateX(70deg); opacity: .2 } 100% { transform: rotate(-0.6deg) rotateX(0); opacity: 1 } }
  .tear-top { height: 26px; background: var(--accent); display: flex; justify-content: space-around; align-items: center; }
  .tear-top .ring { width: 12px; height: 12px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 2px 0 rgba(0,0,0,.25); }
  .tear-date { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 16px 10px; border-bottom: 2px dashed var(--line); }
  .tear-date b { font-size: 52px; line-height: 1; color: var(--accent); font-weight: 800; }
  .tear-date span { font-weight: 700; text-transform: capitalize; line-height: 1.2; }
  .tear-date small { font-weight: 500; color: var(--muted); }
  .tear-date em { font-style: normal; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
  .tear-body { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px 16px; align-items: start; }
  .tear-emoji { width: 64px; height: 64px; border-radius: 18px; background: var(--teal-soft); display: grid; place-items: center; font-size: 36px; }
  .tear-body h3 { margin-bottom: 4px; }
  .tear-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .tear > .tiny { padding: 0 16px 12px; }
  @media (prefers-reduced-motion: reduce) { .tear.flip { animation: none; } }
  .myth { display: grid; gap: 6px; }
  .myth .m { font-weight: 700; color: var(--bad); display: flex; gap: 8px; }
  .myth .t { display: flex; gap: 8px; }
  .myth .t::before { content: "✓"; color: var(--ok); font-weight: 800; }
  .myth .m::before { content: "✕"; font-weight: 800; }

  .report { font-family: inherit; white-space: pre-wrap; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 14px; overflow-wrap: anywhere; }

  form.f { display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .field input, .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; min-width: 0; width: 100%; }
  .err { color: var(--bad); font-size: 14px; font-weight: 600; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 40; }
  footer.legal { font-size: 12px; color: var(--muted); display: grid; gap: 4px; padding-top: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Apple / iOS look: system font, grouped grey ground with white inset cards, translucent bars, segmented controls */
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); font-size: 17px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  body::before { background: color-mix(in srgb, var(--bg) 80%, transparent); }
  header.bar { background: color-mix(in srgb, var(--surface) 78%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid var(--line); }
  .brand svg { width: 30px; height: 30px; }
  .brand b { font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { width: 0; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes ringIn { from { opacity: 0; transform: rotate(-90deg) scale(.85); } to { opacity: 1; transform: none; } }

  #view.enter > *, #mom-app.enter > .stack > * { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  #view.enter > *:nth-child(2), #mom-app.enter > .stack > *:nth-child(2) { animation-delay: .05s; }
  #view.enter > *:nth-child(3), #mom-app.enter > .stack > *:nth-child(3) { animation-delay: .1s; }
  #view.enter > *:nth-child(4), #mom-app.enter > .stack > *:nth-child(4) { animation-delay: .15s; }
  #view.enter > *:nth-child(5), #mom-app.enter > .stack > *:nth-child(5) { animation-delay: .2s; }
  #view.enter > *:nth-child(6), #mom-app.enter > .stack > *:nth-child(6) { animation-delay: .25s; }

/* ---------- photo store (IndexedDB; photos never leave the phone) ---------- */
const PDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('erte-komek', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('photos', mode), st = t.objectStore('photos'), q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { put: (k, v) => tx('readwrite', s => s.put(v, k)), get: k => tx('readonly', s => s.get(k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
// child's profile photo: centre-cropped square, 256 px JPEG (about 15–25 KB) kept with the child's data
function avatarPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 256;
      c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 256, 256);
      res(c.toDataURL('image/jpeg', 0.82)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
const avatarHtml = c => c.photo ? `<img src="${c.photo}" alt="">` : esc(c.name.slice(0, 1).toUpperCase());
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- cycle math ---------- */
function starts() { return S.periods.map(p => p.start).sort(); }
function cycleLens() {
  const st = starts(); const out = [];
  for (let i = 1; i < st.length; i++) { const L = diff(st[i], st[i - 1]); if (L >= 15 && L <= 60) out.push(L); }
  return out;
}
function avgCycle() { const L = cycleLens().slice(-6); return L.length ? Math.round(L.reduce((a, b) => a + b, 0) / L.length) : S.cycleLen; }
function avgPeriod() {
  const L = S.periods.filter(p => p.end).map(p => diff(p.end, p.start) + 1).filter(n => n > 0 && n < 15).slice(-6);
  return L.length ? Math.round(L.reduce((a, b) => a + b, 0) / L.length) : S.periodLen;
}
function lastStart() { const st = starts(); return st[st.length - 1] || null; }
function openPeriod() { const p = S.periods.slice().sort((a, b) => a.start.localeCompare(b.start)).pop(); return p && !p.end && diff(today(), p.start) < 15 ? p : null; }
function cycleInfo(day = today()) {
  const ls = lastStart(); if (!ls) return null;
  const C = avgCycle(), P = avgPeriod();
  const cd = diff(day, ls) + 1;
  let next = add(ls, C); const late = diff(day, next);
  const ovu = add(next, -14), fertS = add(ovu, -5), fertE = add(ovu, 1);
  const inPeriod = isPeriodDay(day);
  let ph = 'fol';
  if (inPeriod) ph = 'men'; else if (day === ovu) ph = 'ovu'; else if (day >= fertS && day <= fertE) ph = 'fert'; else if (day > ovu) ph = 'lut';
  const dOvu = diff(ovu, day);
  const chance = (day >= fertS && day <= fertE) ? (dOvu >= -0 && dOvu <= 2 ? 'high' : 'mid') : 'low';
  return { ls, C, P, cd, next, ovu, fertS, fertE, ph, chance, late: late > 0 ? late : 0, toNext: diff(next, day) };
}
function isPeriodDay(day) {
  for (const p of S.periods) { const e = p.end || add(p.start, avgPeriod() - 1); if (day >= p.start && day <= e) return true; }
  const l = S.logs[day]; return !!(l && l.flow > 0);
}
/* predictions for calendar: next 6 cycles */
function marks() {
  const m = {}; const ls = lastStart(); if (!ls) return m;
  const C = avgCycle(), P = avgPeriod();
  for (let k = 1; k <= 6; k++) {
    const s = add(ls, C * k), ovu = add(s, -14);
    for (let i = 0; i < P; i++) m[add(s, i)] = m[add(s, i)] || 'pred';
    for (let i = -5; i <= 1; i++) { const d = add(ovu, i); if (!m[d]) m[d] = i === 0 ? 'ovu' : 'fert'; }
  }
  /* current cycle fertile window (before the first predicted period) */
  const ovu0 = add(add(ls, C), -14);
  for (let i = -5; i <= 1; i++) { const d = add(ovu0, i); if (!m[d]) m[d] = i === 0 ? 'ovu' : 'fert'; }
  for (const p of S.periods) { const e = p.end || add(p.start, P - 1); for (let d = p.start; d <= e; d = add(d, 1)) m[d] = 'period'; }
  for (const [d, l] of Object.entries(S.logs)) if (l.flow > 0) m[d] = 'period';
  return m;
}
function pregInfo(day = today()) {
  if (!S.preg) return null;
  const days = diff(day, S.preg.lmp); const w = Math.floor(days / 7), dd = days % 7;
  const due = add(S.preg.lmp, 280); const tri = w < 13 ? 1 : w < 27 ? 2 : 3;
  return { w, dd, due, tri, left: diff(due, day), pct: Math.min(100, Math.max(0, days / 280 * 100)) };
}

function bindPin() {
  const i = $('#pin-in'); i.focus();
  i.oninput = async () => { if (i.value.length < 4) return; if (await hash(i.value) === S.pin) { ui.unlocked = true; render(); } else { $('#pin-err').textContent = t().pinWrong; i.value = ''; } };

async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('aisulu:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const c of 'aisulu:' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}

function buildIcs() {

  if (S.mode === 'preg') { const p = pregInfo(); if (p) push(p.due, x.due); }
  else if (c) {
    for (let k = 0; k < 6; k++) { const s = add(c.next, c.C * k); push(add(s, -2), `QUŞAQ: ${x.periodsIn(2)}`); push(add(s, -14), `QUŞAQ: ${x.lgOvu}`); push(add(s, -19), `QUŞAQ: ${x.fertWin}`); }

}

// the service worker cannot read localStorage, so the app writes the next 21 days of messages into Cache Storage
async function syncNotifSchedule() {

    const t = L(), days = [], now = new Date();
    for (let o = 0; o < 21; o++) {
      const d = new Date(now); d.setDate(d.getDate() + o); const di = iso(d); let msg = null;
      const vt = vaxT();
      for (const c of S.children) { const Dv = vaxDone(c);
        for (const v of VAX) { if (Dv[v.id]) continue; const gap = Math.round((vaxDue(c, v) - new Date(di + 'T12:00:00')) / 864e5);
          if (gap === 1 || gap === 0) { msg = { title: (gap ? vt.nTitle : vt.nToday)(c.name, v.age[li()]), body: vt.nBody, tag: 'ek-vax-' + c.id + '-' + v.id }; break; } }
        if (msg) break; }
      if (!msg) for (const c of S.children) {
        const cm = corrM(c, d), si = stageIdx(cm), st = STAGES[si], D = (S.done[c.id] || {});
        const sd = new Date(c.dob + 'T12:00:00'); sd.setMonth(sd.getMonth() + st.min); const since = Math.round((d - sd) / 864e5);
        if (cm >= 2 && !D[st.min] && since >= 0 && since % 3 === 0) { msg = { title: t.nDue(c.name, st.label[li()]), body: t.nDueBody, tag: 'ek-check-' + c.id + '-' + st.min }; break; }
      }
      if (!msg) { const tp = TIPS[tipIndex(d)]; msg = { title: `${tp[0]} ${S.lang === 'kk' ? tp[1] : tp[3]}`, body: S.lang === 'kk' ? tp[2] : tp[4], tag: 'ek-tip' }; }
      days.push({ date: di, ...msg });
    }
    if (NATIVE) { // replace the whole 21-day plan: one reminder a day at 10:00
      const ln = LN(), pend = await ln.getPending(); if (pend.notifications.length) await ln.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
      if (!S.notif) return;
      const list = days.map((d, i) => { const at = new Date(d.date + 'T10:00:00'); return { id: 1000 + i, title: d.title, body: d.body, schedule: { at, allowWhileIdle: true } }; }).filter(n => n.schedule.at > new Date());
      if (list.length) await ln.schedule({ notifications: list });
      return;
    }
    const cache = await caches.open('ek-data');
    await cache.put('ek-schedule.json', new Response(JSON.stringify({ on: !!S.notif, days }), { headers: { 'Content-Type': 'application/json' } }));
  } catch (e) {}
}
async function enableNotif() {

}

function bindDiary() {
  $('#go-growth')?.addEventListener('click', () => go(9));
  const c = child(), t = L();
  $('#d-back')?.addEventListener('click', () => (history.length > 1 && history.state ? history.back() : go(0)));
  $('#e-add')?.addEventListener('click', () => { if (isEx()) { ui.form = 'new'; go(0); ui.form = 'new'; render(); return; } ui.entry = true; ui.eErr = ''; render(); $('#e-text')?.focus(); });
  $('#e-cancel')?.addEventListener('click', () => { ui.entry = false; ui.eErr = ''; render(); });
  $('#e-type')?.addEventListener('change', e => { ui.eType = e.target.value; });
  $('#eform')?.addEventListener('submit', async e => {
    e.preventDefault();
    const type = $('#e-type').value, date = $('#e-date').value || iso(new Date()), text = $('#e-text').value.trim(), h = $('#e-h').value.trim(), w = $('#e-w').value.trim(), f = $('#e-photo').files[0];
    if (!text && !h && !w && !f) { ui.eErr = t.eErr; return render(); }
    const id = 'e' + Date.now().toString(36), ent = { id, type, date, text, h: h ? +h : null, w: w ? +w : null, photo: false };
    if (f) { try { await PDB.put(id, await shrinkPhoto(f)); ent.photo = true; } catch (err) {} }
    (S.diary[c.id] = S.diary[c.id] || []).push(ent); ui.entry = false; ui.eErr = ''; save(); render(); toast(t.save + ' ✓');
  });
  document.querySelectorAll('[data-edel]').forEach(b => b.addEventListener('click', () => { ui.delEntry = b.dataset.edel; render(); }));
  document.querySelectorAll('[data-edel-no]').forEach(b => b.addEventListener('click', () => { ui.delEntry = null; render(); }));
  document.querySelectorAll('[data-edel-yes]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.edelYes; S.diary[c.id] = (S.diary[c.id] || []).filter(x => x.id !== id); PDB.del(id).catch(() => {}); ui.delEntry = null; save(); render(); }));
  document.querySelectorAll('[data-photo]').forEach(img => PDB.get(img.dataset.photo).then(u => { if (u) img.src = u; else img.remove(); }).catch(() => img.remove()));
}

function legal() { return `<footer class="legal">${L().legal.map(x => `<p>${x}</p>`).join('')}</footer>`; }

const SCREENS = [[home, bindHome], [check, bindCheck], [play, bindPlay], [learn, () => {}], [help, bindHelp], [diary, bindDiary], [care, () => {}], [mom, () => MOM.render()], [vax, bindVax], [growth, bindGrowth]];
function mom() { return `<div id="mom" class="stack"><nav class="mtabs" id="mom-tabs" aria-label="${L().momT}"></nav><div id="mom-app"></div><div id="mom-sheet"></div></div>${legal()}`; }
function render() {
  if (S.cur && !S.children.find(c => c.id === S.cur)) S.cur = S.children[0]?.id || null;
  renderShell();
  document.body.classList.toggle('wz-on', !S.stage);
  if (!S.stage) { $('#view').innerHTML = welcome(); bindWelcome(); bindCommon(); animateEnter($('#view'), 'wz' + (ui.wz?.step ?? 0) + (ui.wz?.stage || '')); return; }
  const [view, bind] = SCREENS[S.tab] || SCREENS[0];
  $('#view').innerHTML = view();
  bind(); bindCommon();
  animateEnter($('#view'), 'tab' + S.tab + (S.tab === 1 ? ':' + (ui.stage ?? '') : ''));
  updBack();
}
// screen entrance plays only when the screen changes, not on every tap that re-renders it
let LAST_SCREEN = null;
function animateEnter(el, key) {
  if (!el) return;
  if (key === LAST_SCREEN) { el.classList.remove('enter'); $('#tabbar').classList.remove('switch'); return; }
  LAST_SCREEN = key;
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  const tb = $('#tabbar'); tb.classList.remove('switch'); void tb.offsetWidth; tb.classList.add('switch');
}
document.querySelectorAll('.seg button[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; save(); render(); }));
try { history.replaceState({ t: S.tab, st: null }, ''); } catch (e) {}
render();
if (S.notif) syncNotifSchedule();
