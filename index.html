  :root {

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

    --accent: #6aa8ff; --accent-fg: #0b1626; --accent-soft: #1b2f4d; --teal: #4fd1c5; --teal-soft: #15343a;
    --ok: #6fd69a; --ok-bg: #14321f; --warn: #f2b85b; --warn-bg: #3a2a10; --bad: #ff8a80; --bad-bg: #3d1a17; color-scheme: dark } }
  :root[data-theme="dark"] {

    --accent: #6aa8ff; --accent-fg: #0b1626; --accent-soft: #1b2f4d; --teal: #4fd1c5; --teal-soft: #15343a;
    --ok: #6fd69a; --ok-bg: #14321f; --warn: #f2b85b; --warn-bg: #3a2a10; --bad: #ff8a80; --bad-bg: #3d1a17; color-scheme: dark }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.25; }
  p { margin: 0; }
  ul, ol { margin: 0; }
  button, input, select { font: inherit; color: inherit; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  .bar-in { max-width: 600px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { width: 34px; height: 34px; flex: none; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; font-weight: 700; font-size: 13px; color: var(--muted); }

  main { max-width: 600px; margin: 0 auto; padding-block: 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }

  .tabbar svg { width: 24px; height: 24px; }

  .tabbar .pill { padding: 2px 14px; border-radius: 999px; display: grid; place-items: center; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
  .card.flat { background: var(--surface-2); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .h1 { font-size: 22px; font-weight: 800; }
  .h2 { font-size: 18px; font-weight: 700; }
  .h3 { font-size: 15px; font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .tiny { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 10px; }

  .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.line { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }

  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kv b { display: block; font-size: 15px; }
  .kv span { font-size: 12px; color: var(--muted); }

  .banner { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }
  .banner b { font-size: 15px; }
  .banner p { color: var(--fg); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.todo { background: var(--accent-soft); color: var(--accent); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }

  .q { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface); }
  .q.yes { border-left-color: var(--ok); }
  .q.no { border-left-color: var(--warn); }
  .q.unsure { border-left-color: var(--accent); }
  .q p { font-weight: 600; }
  .ans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ans button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 4px; font-size: 14px; font-weight: 700; color: var(--muted); }

  .ans button[aria-pressed="true"][data-v="no"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .ans button[aria-pressed="true"][data-v="unsure"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .domain-t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .domain-t i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }

  .bar-p { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-p i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }

  .timeline { display: grid; gap: 0; }
  .tl { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .tl:last-child { border-bottom: 0; }
  .tl .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); justify-self: center; }
  .tl .dot.ok { background: var(--ok); border-color: var(--ok); }
  .tl .dot.warn { background: var(--warn); border-color: var(--warn); }
  .tl .dot.cur { border-color: var(--accent); background: var(--accent-soft); }
  .tl button { border: 0; background: none; text-align: left; padding: 0; font-weight: 600; }

  .check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--bad); }
  .check label { font-size: 15px; }

  .steps { list-style: none; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .steps .card { padding: 12px 14px; gap: 4px; }

  details.art { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  details.art summary { list-style: none; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr 20px; gap: 12px; align-items: center; cursor: pointer; }

  details.art .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
  details.art .ic svg { width: 22px; height: 22px; }
  details.art .chev { transition: transform .2s; color: var(--muted); }
  details.art[open] .chev { transform: rotate(90deg); }
  details.art .body { padding: 0 16px 16px; display: grid; gap: 10px; }
  details.art ul { padding-left: 20px; display: grid; gap: 6px; }
  .src { font-size: 12px; color: var(--muted); }

  .act { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
  .tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .week div { display: grid; gap: 4px; justify-items: center; font-size: 12px; color: var(--muted); }
  .week i { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-style: normal; font-weight: 700; color: var(--fg); font-size: 12px; }
  .week i.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .week i.today { outline: 2px solid var(--accent); outline-offset: 1px; }

  .myth { display: grid; gap: 6px; }
  .myth .m { font-weight: 700; color: var(--bad); display: flex; gap: 8px; }
  .myth .t { display: flex; gap: 8px; }
  .myth .t::before { content: "✓"; color: var(--ok); font-weight: 800; }
  .myth .m::before { content: "✕"; font-weight: 800; }

  .report { font-family: inherit; white-space: pre-wrap; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 14px; overflow-wrap: anywhere; }

  form.f { display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .field input, .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; min-width: 0; width: 100%; }
  .err { color: var(--bad); font-size: 14px; font-weight: 600; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 40; }
  footer.legal { font-size: 12px; color: var(--muted); display: grid; gap: 4px; padding-top: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const EX_ANS = { 18: { 0: 'yes', 1: 'yes', 2: 'no', 3: 'yes', 4: 'yes' }, 15: { 0: 'yes', 1: 'yes', 2: 'yes', 3: 'yes', 4: 'yes' } };
const EX_DONE = { 15: iso(new Date(Date.now() - 120 * 864e5)) };
const ansOf = id => (id === 'example' ? EX_ANS : (S.ans[id] || {}));
const doneOf = id => (id === 'example' ? EX_DONE : (S.done[id] || {}));

function monthsBetween(a, b) {
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) m--;
  return m;
}
function ageM(c) {
  const b = new Date(c.dob + 'T00:00:00');
  if (isNaN(b)) return NaN;
  return monthsBetween(b, new Date());
}
function corrM(c) {
  const m = ageM(c), w = parseInt(c.weeks, 10);
  if (w && w < 37 && m < 24) return Math.max(0, m - Math.round((40 - w) / 4.35));
  return m;
}
function ageTxt(m) {
  const t = L();
  if (isNaN(m)) return '—';
  if (m < 1) return t.newborn;
  const y = Math.floor(m / 12), r = m % 12;
  return [y ? `${y} ${t.y}` : '', r ? `${r} ${t.m}` : ''].filter(Boolean).join(' ');
}
const stageIdx = m => { let i = 0; STAGES.forEach((s, k) => { if (m >= s.min) i = k; }); return i; };
function stageState(c, st) {
  const a = ansOf(c.id)[st.min] || {}, n = st.items.length;
  const vals = st.items.map((_, i) => a[i]);
  const done = vals.filter(Boolean).length, no = vals.filter(v => v === 'no').length, uns = vals.filter(v => v === 'unsure').length;
  let k = 'todo';
  if (no) k = 'warn'; else if (done === n) k = uns ? 'unsure' : 'ok'; else if (done) k = 'part';
  return { a, done, n, no, uns, k };
}

/* ---------- shell ---------- */
const NAV = ['home', 'check', 'play', 'learn', 'help'];
function renderShell() {
  document.documentElement.lang = S.lang;
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  $('#sub').textContent = L().sub;
  document.querySelectorAll('.seg button[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
  $('#tabbar').innerHTML = NAV.map((n, i) => `<button type="button" id="nav-${n}" ${S.tab === i ? 'aria-current="page"' : ''}>
    <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg></span>${L().nav[i]}</button>`).join('');
  NAV.forEach((n, i) => $('#nav-' + n).addEventListener('click', () => go(i)));
}
function go(i, stage) { S.tab = i; ui.stage = stage ?? null; ui.form = null; ui.confirmDel = false; save(); render(); window.scrollTo(0, 0); }
function toast(msg) {
  ui.toast = msg; const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

/* ---------- child card + form ---------- */
function childPicker() {
  if (S.children.length < 2) return '';
  return `<div class="chips">${S.children.map(c => `<button type="button" class="chip" data-child="${c.id}" aria-pressed="${c.id === child().id}">${esc(c.name)}</button>`).join('')}</div>`;
}
function childForm() {
  const t = L(), c = ui.form === 'new' ? { name: '', dob: '', weeks: '' } : child();
  return `<div class="card"><form class="f" id="cform" novalidate>
    <h2 class="h2">${ui.form === 'new' ? t.addChild : t.editChild}</h2>
    <div class="field"><label for="f-name">${t.name}</label><input id="f-name" maxlength="40" autocomplete="off" value="${esc(c.name)}"></div>
    <div class="field"><label for="f-dob">${t.dob}</label><input id="f-dob" type="date" max="${iso(new Date())}" value="${esc(c.dob)}"></div>
    <div class="field"><label for="f-weeks">${t.weeks}</label><input id="f-weeks" type="number" inputmode="numeric" min="22" max="42" placeholder="40" value="${esc(c.weeks)}"><span class="tiny muted">${t.weeksHint}</span></div>
    ${ui.err ? `<p class="err">${ui.err}</p>` : ''}
    <div class="row"><button class="btn primary" type="submit">${t.save}</button><button class="btn line" type="button" id="f-cancel">${t.cancel}</button></div>
  </form></div>`;
}
function bindChildForm() {
  const f = $('#cform'); if (!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const t = L(), name = $('#f-name').value.trim(), dob = $('#f-dob').value, weeks = $('#f-weeks').value.trim();
    const m = dob ? monthsBetween(new Date(dob + 'T00:00:00'), new Date()) : NaN;
    if (!name) { ui.err = t.errName; return render(); }
    if (!dob || isNaN(m) || m < 0 || m > 72) { ui.err = t.errDob; return render(); }
    if (ui.form === 'new') { const id = 'c' + Date.now().toString(36); S.children.push({ id, name, dob, weeks }); S.cur = id; }
    else Object.assign(child(), { name, dob, weeks });
    ui.form = null; ui.err = ''; save(); render(); toast(t.save + ' ✓');
  });
  $('#f-cancel').addEventListener('click', () => { ui.form = null; ui.err = ''; render(); });
}
function bindCommon() {
  document.querySelectorAll('[data-child]').forEach(b => b.addEventListener('click', () => { S.cur = b.dataset.child; ui.stage = null; save(); render(); }));
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { ui.form = 'new'; ui.err = ''; S.tab = 0; render(); $('#f-name')?.focus(); }));
  bindChildForm();
}

/* ---------- screens ---------- */
function home() {
  const t = L(), c = child(), m = ageM(c), cm = corrM(c), si = stageIdx(cm), st = STAGES[si], ss = stageState(c, st);
  const next = STAGES[si + 1];
  const nextTxt = ss.k === 'todo' || ss.k === 'part' ? t.now : next ? `${next.label[li()]} · ${t.inM(Math.max(1, next.min - cm))}` : '—';
  const pg = PLAY.find(p => cm < p.max) || PLAY[PLAY.length - 1];
  const dayN = Math.floor(Date.now() / 864e5);
  const pi = pg.items[dayN % pg.items.length];
  const tipA = ARTICLES[dayN % ARTICLES.length], tip = (S.lang === 'kk' ? tipA.k : tipA.r)[Math.floor(dayN / ARTICLES.length) % 5];
  const flagsN = (S.flags[c.id] || []).length;

  const statusTxt = { ok: t.stageStatus.ok, warn: t.stageStatus.warn, unsure: t.stageStatus.part, todo: t.stageStatus.todo, part: t.stageStatus.part }[ss.k];

  return `
    ${ui.form ? childForm() : ''}
    ${isEx() && !ui.form ? `<div class="banner info"><p>${t.example}</p><button class="btn primary sm" type="button" data-add style="justify-self:start">＋ ${t.addChild}</button></div>` : ''}
    ${childPicker()}
    <div class="card">
      <div class="row between">
        <div class="row" style="flex-wrap:nowrap;min-width:0">
          <div class="avatar">${esc(c.name.slice(0, 1).toUpperCase())}</div>
          <div style="min-width:0"><div class="h1">${esc(c.name)}</div><div class="small muted num">${fmtDate(c.dob)}</div></div>
        </div>
        ${isEx() ? '' : `<button class="btn line sm" type="button" id="edit">${t.editChild}</button>`}
      </div>
      <div class="kv num">
        <div><span>${t.age}</span><b>${ageTxt(m)}</b></div>
        <div><span>${cm !== m ? t.corrected : t.nextCheck}</span><b>${cm !== m ? ageTxt(cm) : (ss.k === 'todo' || ss.k === 'part' ? t.now : next ? next.label[li()] : '—')}</b></div>
        <div><span>${L().nav[1]}</span><b>${st.label[li()]}</b></div>
      </div>
      ${!isEx() && S.children.length ? `<div class="row"><button class="link small" type="button" data-add>＋ ${t.addChild}</button></div>` : ''}
    </div>
    ${flagsN ? `<div class="banner bad"><b>${t.flagsHit(flagsN)}</b><p>${t.flagsHitP}</p></div>` : ''}
    <div class="card">
      <div class="row between"><span class="eyebrow">${st.label[li()]}</span><span class="status ${statusCls}">${statusTxt}</span></div>
      <h2 class="h2">${t.stageFor(st.label[li()])}</h2>
      <div class="bar-p"><i style="width:${ss.done / ss.n * 100}%"></i></div>
      <p class="small muted num">${t.answered(ss.done, ss.n)}${doneOf(c.id)[st.min] ? ' · ' + t.checkedOn(fmtDate(doneOf(c.id)[st.min])) : ''}</p>
      <button class="btn primary block" type="button" id="go-check">${btnTxt}</button>
      <p class="tiny muted">${t.nextCheck}: ${nextTxt}</p>
    </div>
    <div class="card">
      <span class="eyebrow">${t.todayPlay} · ${pg.label[li()]}</span>
      <h3 class="h3">${S.lang === 'kk' ? pi[0] : pi[2]}</h3>
      <p class="small">${S.lang === 'kk' ? pi[1] : pi[3]}</p>
      <button class="link small" type="button" id="go-play" style="justify-self:start">${t.allPlays} →</button>
    </div>
    <div class="card flat">
      <span class="eyebrow">${t.tip}</span>
      <p>${tip}</p>
      <p class="src">${tipA.t[li()]}</p>
    </div>
    ${ui.form || isEx() ? '' : `<div class="card flat">
      <div class="row between"><span class="small muted">${t.theme}</span>
        <div class="seg" role="group">${['auto', 'light', 'dark'].map((v, i) => `<button type="button" id="th-${v}" data-theme-set="${v}" aria-pressed="${S.theme === v}">${t.themes[i]}</button>`).join('')}</div></div>
      ${ui.confirmDel
        ? `<div class="banner bad"><p>${t.confirmDel(esc(c.name))}</p><div class="row"><button class="btn sm" style="background:var(--bad);color:#fff" type="button" id="del-yes">${t.yesDel}</button><button class="btn line sm" type="button" id="del-no">${t.cancel}</button></div></div>`
        : `<button class="link small" type="button" id="del" style="justify-self:start;color:var(--bad)">${t.delChild}: ${esc(c.name)}</button>`}

function bindHome() {
  $('#go-check')?.addEventListener('click', () => go(1));
  $('#go-play')?.addEventListener('click', () => go(2));
  $('#edit')?.addEventListener('click', () => { ui.form = 'edit'; ui.err = ''; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { S.theme = b.dataset.themeSet; save(); render(); }));
  $('#del')?.addEventListener('click', () => { ui.confirmDel = true; render(); });
  $('#del-no')?.addEventListener('click', () => { ui.confirmDel = false; render(); });
  $('#del-yes')?.addEventListener('click', () => {
    const id = child().id; S.children = S.children.filter(c => c.id !== id);
    [S.ans, S.done, S.play, S.flags].forEach(o => delete o[id]);
    S.cur = S.children[0]?.id || null; ui.confirmDel = false; save(); render();
  });
}

function check() {
  const t = L(), c = child(), cm = corrM(c), cur = stageIdx(cm);
  const si = ui.stage ?? cur, st = STAGES[si], ss = stageState(c, st), k = li() + 1;
  const res = t.res[ss.k === 'part' ? 'todo' : ss.k];
  const title = typeof res[0] === 'function' ? res[0](ss.no) : res[0];
  const cls = { ok: 'ok', warn: 'warn', unsure: 'info', todo: 'info', part: 'info' }[ss.k];
  const groups = {}; st.items.forEach((it, i) => (groups[it[0]] = groups[it[0]] || []).push(i));
  const D = doneOf(c.id);
  return `
    ${childPicker()}
    <div class="card">
      <div class="row between"><span class="eyebrow">${esc(c.name)} · ${ageTxt(cm)}</span>${si === cur ? `<span class="status todo">${t.current}</span>` : ''}</div>
      <h1 class="h1">${t.stageFor(st.label[li()])}</h1>
      <p class="small muted">${cm < 2 && si === 0 ? t.early : t.note}</p>
      <div class="bar-p"><i style="width:${ss.done / ss.n * 100}%"></i></div>
      <p class="small muted num">${t.answered(ss.done, ss.n)}${D[st.min] ? ' · ' + t.checkedOn(fmtDate(D[st.min])) : ''}</p>
    </div>
    ${isEx() ? `<div class="banner info"><p>${t.example}</p><button class="btn primary sm" type="button" data-add style="justify-self:start">＋ ${t.addChild}</button></div>` : ''}
    ${Object.entries(groups).map(([d, idx]) => `
      <div class="domain-t"><i></i>${t.domains[d]}</div>
      ${idx.map(i => `<div class="q ${ss.a[i] || ''}">
        <p>${st.items[i][k]}</p>
        <div class="ans" role="group">${['yes', 'no', 'unsure'].map(v => `<button type="button" id="a-${st.min}-${i}-${v}" data-i="${i}" data-v="${v}" aria-pressed="${ss.a[i] === v}">${t[v]}</button>`).join('')}</div>
      </div>`).join('')}`).join('')}
    <div class="banner ${cls}"><b>${title}</b><p>${res[1]}</p>
      ${ss.k === 'warn' ? `<button class="btn primary sm" type="button" id="to-report" style="justify-self:start">${t.toReport} →</button>` : ''}</div>
    ${cm >= 16 && cm <= 30 ? `<div class="banner info"><p>${t.mchat}</p></div>` : ''}
    ${ss.done && !isEx() ? `<button class="btn line sm" type="button" id="reset" style="justify-self:start">${t.reset}</button>` : ''}
    <div class="card">
      <h2 class="h3">${t.allStages}</h2>
      <div class="timeline">${STAGES.map((s, i) => {
        const x = stageState(c, s), future = s.min > cm && i > cur;
        const dot = i === si ? 'cur' : x.k === 'ok' ? 'ok' : x.k === 'warn' ? 'warn' : '';
        const lab = future ? '' : x.k === 'ok' ? t.stageStatus.ok : x.k === 'warn' ? t.stageStatus.warn : x.done ? t.stageStatus.part : i === cur ? t.stageStatus.todo : '—';
        return `<div class="tl"><span class="dot ${dot}"></span>
          ${future ? `<span class="muted">${s.label[li()]}</span>` : `<button type="button" data-stage="${i}">${s.label[li()]}${i === cur ? ` · <span class="muted">${t.current}</span>` : ''}</button>`}
          <span class="tiny muted">${lab}</span></div>`;
      }).join('')}</div>
    </div>
    ${legal()}`;
}
function bindCheck() {
  const c = child(), si = ui.stage ?? stageIdx(corrM(c)), st = STAGES[si];
  document.querySelectorAll('.ans button').forEach(b => b.addEventListener('click', () => {
    if (isEx()) { ui.form = 'new'; S.tab = 0; render(); window.scrollTo(0, 0); $('#f-name')?.focus(); return; }
    const a = bucket(bucket(S.ans, c.id), st.min), i = b.dataset.i;
    if (a[i] === b.dataset.v) delete a[i]; else a[i] = b.dataset.v;
    const ss = stageState(c, st);
    if (ss.done === ss.n) bucket(S.done, c.id)[st.min] = iso(new Date()); else delete bucket(S.done, c.id)[st.min];
    save(); const y = window.scrollY; render(); window.scrollTo(0, y); document.getElementById(b.id)?.focus({ preventScroll: true });
  }));
  document.querySelectorAll('[data-stage]').forEach(b => b.addEventListener('click', () => { ui.stage = +b.dataset.stage; render(); window.scrollTo(0, 0); }));
  $('#reset')?.addEventListener('click', () => { delete bucket(S.ans, c.id)[st.min]; delete bucket(S.done, c.id)[st.min]; save(); render(); });
  $('#to-report')?.addEventListener('click', () => { go(4); setTimeout(() => $('#report')?.scrollIntoView({ block: 'start' }), 50); });
}

function weekDays() {
  const now = new Date(), dow = (now.getDay() + 6) % 7, out = [];
  for (let i = 0; i < 7; i++) { const d = new Date(now); d.setDate(now.getDate() - dow + i); out.push(iso(d)); }
  return out;
}
function play() {
  const t = L(), c = child(), cm = corrM(c), today = iso(new Date());
  const P = (isEx() ? {} : S.play[c.id]) || {}, wk = weekDays();
  const n = wk.filter(d => (P[d] || []).length).length;
  return `
    ${childPicker()}
    <div class="card">
      <span class="eyebrow">${esc(c.name)} · ${ageTxt(cm)}</span>
      <h1 class="h1">${t.playT}</h1>
      <p class="small muted">${t.playNote}</p>
      <div class="week num">${wk.map((d, i) => `<div><i class="${(P[d] || []).length ? 'on' : ''} ${d === today ? 'today' : ''}">${+d.slice(8)}</i>${t.days[i]}</div>`).join('')}</div>
      <p class="small"><b>${t.streak(n)}</b></p>
    </div>
    ${isEx() ? `<div class="banner info"><p>${t.example}</p><button class="btn primary sm" type="button" data-add style="justify-self:start">＋ ${t.addChild}</button></div>` : ''}
    ${PLAY.map(g => {
      const mine = g === (PLAY.find(p => cm < p.max) || PLAY[PLAY.length - 1]);
      if (!mine) return '';
      return `<span class="eyebrow">${g.label[li()]}</span>` + g.items.map((it, i) => {
        const on = (P[today] || []).includes(i);
        return `<div class="card act"><div class="stack" style="gap:4px"><h3 class="h3">${S.lang === 'kk' ? it[0] : it[2]}</h3><p class="small">${S.lang === 'kk' ? it[1] : it[3]}</p></div>
          <button type="button" class="tick" id="pl-${i}" data-play="${i}" aria-pressed="${on}" aria-label="✓"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;
      }).join('');
    }).join('')}
    ${legal()}`;
}
function bindPlay() {
  const c = child(), today = iso(new Date());
  document.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => {
    if (isEx()) { ui.form = 'new'; S.tab = 0; render(); window.scrollTo(0, 0); return; }
    const P = bucket(S.play, c.id), arr = P[today] = P[today] || [], i = +b.dataset.play;
    P[today] = arr.includes(i) ? arr.filter(x => x !== i) : arr.concat(i);
    if (!P[today].length) delete P[today];
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  }));
}

function learn() {

    <div class="card"><h1 class="h1">${t.learnT}</h1></div>

    <div class="card"><h2 class="h2">${t.mythsT}</h2>

function reportText(c) {
  const t = L(), r = t.rep, k = li() + 1, cm = corrM(c), si = stageIdx(cm), D = doneOf(c.id), A = ansOf(c.id);
  const lines = [r.head, '', `${r.child}: ${c.name}, ${ageTxt(ageM(c))} (${r.born} ${fmtDate(c.dob)})` + (parseInt(c.weeks, 10) < 37 ? ` — ${c.weeks} wk, ${t.corrected.toLowerCase()} ${ageTxt(cm)}` : '')];
  const stages = STAGES.filter((s, i) => i <= si && (A[s.min] && Object.keys(A[s.min]).length || i === si)).reverse().slice(0, 3);
  stages.forEach(s => {
    const a = A[s.min] || {}, no = s.items.filter((_, i) => a[i] === 'no'), un = s.items.filter((_, i) => a[i] === 'unsure');
    lines.push('', `${r.stage} ${s.label[li()]} — ${D[s.min] ? r.checked + ' ' + fmtDate(D[s.min]) : r.notChecked}`);
    if (no.length) { lines.push(r.no); no.forEach(x => lines.push('  • ' + x[k])); }
    if (un.length) { lines.push(r.unsure); un.forEach(x => lines.push('  • ' + x[k])); }
    if (D[s.min] && !no.length && !un.length) lines.push(r.allYes);
  });
  const F = (S.flags[c.id] || []).map(i => FLAGS[i][li()]);
  lines.push('', r.flags + (F.length ? '' : ' ' + r.none));
  F.forEach(x => lines.push('  • ' + x));
  lines.push('', r.foot, `${fmtDate(iso(new Date()))}`);
  return lines.join('\n');
}

}
function bindHelp() {
  const c = child();
  document.querySelectorAll('[data-flag]').forEach(b => b.addEventListener('change', () => {
    if (isEx()) { b.checked = false; ui.form = 'new'; S.tab = 0; render(); window.scrollTo(0, 0); return; }
    const i = +b.dataset.flag, F = S.flags[c.id] || [];
    S.flags[c.id] = b.checked ? [...new Set(F.concat(i))].sort() : F.filter(x => x !== i);
    save(); const y = window.scrollY; render(); window.scrollTo(0, y); document.getElementById(b.id)?.focus({ preventScroll: true });
  }));
  $('#copy')?.addEventListener('click', () => {
    const txt = $('#rep-text').innerText, t = L();
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#rep-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t.selected); };
    try { navigator.clipboard.writeText(txt).then(() => toast(t.copied), sel); } catch (e) { sel(); }
  });
}

function legal() { return `<footer class="legal">${L().legal.map(x => `<p>${x}</p>`).join('')}</footer>`; }

const SCREENS = [[home, bindHome], [check, bindCheck], [play, bindPlay], [learn, () => {}], [help, bindHelp]];
function render() {
  if (S.cur && !S.children.find(c => c.id === S.cur)) S.cur = S.children[0]?.id || null;
  renderShell();
  const [view, bind] = SCREENS[S.tab] || SCREENS[0];
  $('#view').innerHTML = view();
  bind(); bindCommon();
}
document.querySelectorAll('.seg button[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; save(); render(); }));
render();
</script>
